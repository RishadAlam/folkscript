name: Application checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }} / Node 22
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, gd, zip, bcmath, pcntl, posix
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - name: Verify reader interactions
        run: node --test tests/JavaScript/*.test.mjs
      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
      - name: Verify PHP and views
        run: |
          find app routes database/migrations -name '*.php' -print0 | xargs -0 -n1 php -l
          php artisan view:cache
          php artisan route:cache
      - name: Run application checks
        env:
          DB_DATABASE: ':memory:'
        run: php artisan test --compact
