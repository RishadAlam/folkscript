<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1E2A47">
    <title>You're offline — Folkscript</title>
    <style>
        :root{color-scheme:light dark;--paper:#F6F3EC;--ink:#1E2A47;--muted:#606779;--line:#d7d5cd}
        *{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font-family:Georgia,serif;display:grid;place-items:center;padding:28px}main{max-width:570px}header{font-size:27px;margin-bottom:80px;letter-spacing:-1px}header::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#D9A441;margin-left:4px}small{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--muted)}h1{font-size:clamp(42px,8vw,64px);font-weight:400;line-height:1.04;letter-spacing:-2px;margin:20px 0}p{font-size:19px;line-height:1.7;color:var(--muted);margin:24px 0 36px}a{display:inline-block;padding:14px 23px;background:var(--ink);color:var(--paper);text-decoration:none;font-size:16px;border-radius:5px}a:focus-visible{outline:3px solid #D9A441;outline-offset:5px}footer{border-top:1px solid var(--line);padding-top:24px;margin-top:76px;color:var(--muted);font-size:14px}@media(prefers-color-scheme:dark){:root{--paper:#141B2E;--ink:#F6F3EC;--muted:#b2b9c8;--line:#35405a}}
    </style>
</head>
<body><main><header><strong>Folk</strong>script</header><small>A moment to reconnect</small><h1>The next good story<br>can wait a moment.</h1><p>It looks like you're offline. Reconnect to keep reading and writing with your people.</p><a href="/">Try again <span aria-hidden="true">↗</span></a><footer>Written by the people, read by everyone.</footer></main></body>
</html>
